[alembic]
script_location = alembic
# URL берётся из AMI_DATABASE_URL (см. alembic/env.py); значение ниже — запасное.
sqlalchemy.url = sqlite:///./ami.db
prepend_sys_path = .
version_table_name = alembic_version

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
