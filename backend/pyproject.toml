[project]
name = "ami-backend"
version = "0.2.0"
description = "AMI - Avito Market Intelligence Backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AMI"}
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2.0",
    "greenlet>=3.0",
    "httpx>=0.27",
    "colorlog>=6.8",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
ml = ["pandas>=2.1", "scikit-learn>=1.4"]
llm = ["ollama>=0.1.0"]
telegram = ["aiogram>=3.4.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
